version: '3.8'

services:
  operator-console:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prism-operator-console
    ports:
      - "8501:8501"
    command: ["streamlit", "run", "scripts/run_dashboard.py", "--server.port=8501", "--server.address=0.0.0.0", "--server.headless=true"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  web-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prism-web-dashboard
    ports:
      - "8000:8000"
    command: ["python", "-m", "http.server", "8000", "--directory", "prism/dashboard/web", "--bind", "0.0.0.0"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
