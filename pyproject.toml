[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-cwm"
version = "1.0.0"
description = "PRISM: Causal World Models with Counterfactual Verification and Provable Safety Invariants"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "PRISM Research & Engineering Team"}
]
keywords = [
    "causal-inference",
    "world-models",
    "counterfactuals",
    "safety-verification",
    "reinforcement-learning",
    "digital-twins",
    "cyber-physical-systems"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0",
    "streamlit>=1.30.0",
    "click>=8.0.0",
    "networkx>=3.0",
    "matplotlib>=3.7.0",
    "jsonschema>=4.18.0",
    "altair>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "coverage>=7.0.0",
    "black>=24.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]
notebooks = [
    "jupyter>=1.0.0",
    "ipywidgets>=8.0.0",
]

[project.scripts]
prism = "prism.cli:main"

[project.urls]
Homepage = "https://github.com/rakeshraks2612-maker/causal-world-model"
Repository = "https://github.com/rakeshraks2612-maker/causal-world-model.git"
Documentation = "https://github.com/rakeshraks2612-maker/causal-world-model/blob/main/README.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["prism*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".git",
    ".venv",
    "artifacts",
    "data",
]
